# Basic Information 
title: Jefferson Leal
pronoun: he/him
position: PhD Candidate
affiliation: University of Rochester
email: jefferson.leal (at) rochester.edu

# Search Engine Optimization (SEO)
# The following information is used to improve the website traffic from search engines, e.g., Google.
keywords: political science, computational social science, NLP, causal inference, Brazil politics
description: Jefferson Leal is a PhD Candidate in Political Science at the University of Rochester, specializing in computational text analysis and Latin American politics.
canonical: https://jeff-leal.github.io/

# Site URL. Needed by jekyll-sitemap to build absolute links.
url: https://jeff-leal.github.io
baseurl: ""

# Paste the content="..." value from Google Search Console's HTML tag method here.
# Leave empty and no tag is emitted.
google_site_verification: ""

# Profiles to declare as the same person in the page's structured data.
# Every URL you add here, and every one of those profiles that links back,
# is a signal Google uses to connect this site to your name.
same_as:
  - https://github.com/jeff-leal
# - https://scholar.google.com/citations?user=YOUR_ID
# - https://orcid.org/0000-0000-0000-0000
# - https://www.linkedin.com/in/your-handle/

plugins:
  - jekyll-sitemap

# Links
# If you don't need one of them, you may delete the corresponding line.
#google_scholar: https://scholar.google.com/
cv_link: assets/files/jefferson_leal_cv.pdf
#github_link: https://github.com/jeff-leal
#linkedin: https://www.linkedin.com/in/your-handle/
#twitter: https://twitter.com/

# Images (e.g., your profile picture and your website's favicon) 
# "favicon" and "favicon_dark" are used for the light and dark modes, respectively. 
avatar: ./assets/img/avatar.png
favicon: ./assets/img/favicon.png
favicon_dark: ./assets/img/favicon-dark.png

# Footnote
# You may use the option to disable the footnote, "Powered by Jekyll and Minimal Light theme."
enable_footnote: false

# Auto Dark Mode
# You may use the option to disable the automatic dark theme
auto_dark_mode: true

# Font
# You can use this option to choose between Serif or Sans Serif fonts.
font: "Serif" # or "Sans Serif"

# Google Analytics ID
# Please remove this if you don't use Google Analytics
#google_analytics: UA-111540567-4

# Use this project as a remote theme for GitHub Pages
# See the guide here: https://docs.github.com/en/pages/setting-up-a-github-pages-site-with-jekyll/adding-a-theme-to-your-github-pages-site-using-jekyll
remote_theme: yaoyao-liu/minimal-light

# The following files will be removed from the generated website.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - README_zh_Hans.md
  - README_zh_Hant.md
  - README_de.md
  - LICENSE
  - minimal-light.gemspec
  # Working files kept in the repo but not part of the published site.
  - name typography.pptx
  - jeff_profile_pic.png          # the published copy lives in assets/img/
  # Font demo page shipped with Blender Pro; was showing up in the sitemap.
  - assets/fonts/BlenderPro/demo.html
  - html_source_file/
